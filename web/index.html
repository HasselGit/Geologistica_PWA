<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GeoLogística - Sistema de Gestión y Trazabilidad Apícola">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Mobile PWA Status Bar & Theme Colors -->
  <meta name="theme-color" content="#08201A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GeoLogística">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GeoLogística</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #08201A;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #pwa-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #0F2C24 0%, #08201A 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.4s ease-out;
    }
    .splash-logo-container {
      position: relative;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .splash-icon {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 25px rgba(198, 142, 23, 0.35);
      animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }
    .splash-title {
      color: #FFFFFF;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .splash-subtitle {
      color: #C68E17;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(198, 142, 23, 0.2); }
      50% { transform: scale(1.04); box-shadow: 0 14px 35px rgba(0,0,0,0.6), 0 0 30px rgba(198, 142, 23, 0.45); }
    }
  </style>
</head>
<body>
  <div id="pwa-splash">
    <div class="splash-logo-container">
      <img src="icons/Icon-192.png" alt="GeoLogística" class="splash-icon">
    </div>
    <div class="splash-title">GEOLOGÍSTICA</div>
    <div class="splash-subtitle">TRAZABILIDAD APÍCOLA</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('pwa-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
